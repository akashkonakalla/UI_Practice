<!DOCTYPE html>
<html>
<head>
    <title>
        Task 5 - Two Column Layout (Flexbox)
    </title>
    <style>
        /* h1{
            padding: 80px;
            color: aliceblue;
            background-color: green;
        } */
        
       
        .maindiv{
            border: 2px solid blue ;
            border-radius: 10px;
        }
        nav{
            color: rgb(255, 255, 255);
            background-color: rgb(26, 95, 172);
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            padding: 10px;
            align-items: center ;
            border-top-left-radius: 10px;
            border-top-right-radius: 10px;
        }

        
        nav ol {
            display: flex;
            list-style-type: none;

        }

        nav ol a{
            text-decoration: none ;
            padding: 10px;
            color: white;
            border-radius: 10px;
        }
        nav ol a:hover{
            background-color: rgb(77, 145, 222);
        }

        /* div body */
        .divbody{
            display: flex;
            flex-direction: row;
            padding: 10px;
            justify-content: space-between;
            gap:10px;
           
        }
    
        /* div body css */
        .sidebar{
            background-color: rgb(209, 234, 254);
            color:rgb(32, 68, 113);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px; 
            border-radius: 10px;

        }
        .sidebar ol {
            list-style-type: none;
            padding: 0px;
            margin: 0px;
        }
        .sidebar ol a{
            text-decoration: none;
            color: rgb(99, 153, 196);
            padding: 10px;

        } 
        
        .sidebar ol li{
            color: rgb(99, 153, 196);
            padding: 10px;

        } 

        .maincontent{
            border: 2px solid black;
            justify-content: left;
            padding: 10px;
            border-radius: 10px;
        }

        .footer{
            justify-items: center;
            background-color: rgb(43, 63, 96);
            color: white;
            padding: 9px;
            border-bottom-left-radius: 10px;
            border-bottom-right-radius: 10px;
        }
       
    </style>
</head>
<body>
    <div class="maindiv">   
        <nav>

            <div ><h2>My Website </h2></div>
            <div> 
                <ol>
                    <li><a href="#home">Home</a></li>
                    <li><a href="#about">About</a></li>
                    <li><a href="#Services">Services</a></li>
                    <li><a href="#contact">Contact</a></li>
                </ol>
            </div>

        </nav>

        <div class="divbody">
            <div class="sidebar">
                <h3>Sidebar</h3>
                <ol>
                    <li><a href="#dashboard">Dashboard</a></li>
                    <li><a href="#profile">Profile</a></li>
                    <li><a href="#settings">Settings</a></li>
                    <li><a href="#logout">Logout</a></li>
                </ol>
            </div>
            <div class="maincontent">
                <h2>Main Content</h2>
                <p1>This is the main content area. 
                    You can add text, images, 
                    or any other information here.</p1>
            </div>
        </div>

        <div class="footer">
            <h3>footer</h3>
        </div>
        


    </div>

</body>
</html>
