<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEO BURST - 4K Anamorphic Wallpaper</title>
<style>
    * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:#050507;
    color:#fff;
    font-family: 'Segoe UI', system-ui, sans-serif;
    overflow:hidden;
    height:100vh;
    width:100vw;
  }
  /* Tunnel background */
  .tunnel {
    position:absolute;
    inset:0;
    background: 
      radial-gradient(ellipse at center, rgba(255,20,20,0.15) 0%, transparent 60%),
      radial-gradient(ellipse at center, #0a0a12 0%, #000 75%);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .tunnel::before {
    content:'';
    position:absolute;
    inset:0;
    background: repeating-linear-gradient(
      90deg,
      rgba(255,255,255,0.03) 0px,
      rgba(255,255,255,0.03) 1px,
      transparent 1px,
      transparent 120px
    );
    transform: perspective(800px) rotateX(15deg);
    animation: move 1s linear infinite;
  }
  @keyframes move {
    from { transform: perspective(800px) rotateX(15deg) translateZ(0); }
    to { transform: perspective(800px) rotateX(15deg) translateZ(120px); }
  }

  /* Car silhouette using CSS shapes + glow */
  .car-wrap {
    position:relative;
    z-index:2;
    width:85vw;
    max-width:1100px;
    height:45vh;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    filter: drop-shadow(0 0 40px rgba(255,0,0,0.6));
    animation: burst 3s ease-in-out infinite alternate;
  }
  @keyframes burst {
    0% { transform: scale(0.9) translateZ(0); }
    100% { transform: scale(1.08) translateY(-10px); }
  }
  .car {
    width:100%;
    height:100%;
    background: linear-gradient(180deg, #ff1a1a 0%, #a00000 60%, #4a0000 100%);
    clip-path: polygon(15% 100%, 10% 65%, 20% 45%, 35% 30%, 65% 28%, 85% 45%, 90% 65%, 85% 100%);
    position:relative;
    box-shadow: inset 0 20px 30px rgba(255,255,255,0.4), inset 0 -20px 30px rgba(0,0,0,0.8);
  }
  .headlight {
    position:absolute;
    top:42%;
    width:18%;
    height:12%;
    background: radial-gradient(circle, #fff 0%, #aef 60%, #00bfff 100%);
    box-shadow: 0 0 30px #00bfff, 0 0 60px #fff;
    border-radius:4px;
  }
  .headlight.left { left:8%; transform: skewX(-20deg); }
  .headlight.right { right:8%; transform: skewX(20deg); }

  /* Particles */
  .particles {
    position:absolute;
    inset:0;
    pointer-events:none;
    z-index:3;
  }
  .particle {
    position:absolute;
    width:3px; height:3px;
    background:#fff;
    border-radius:50%;
    box-shadow: 0 0 6px #ff3300;
    animation: fly linear infinite;
  }
  @keyframes fly {
    from { transform: translate3d(0,0,0) scale(0); opacity:1; }
    to { transform: translate3d(var(--x), var(--y), 300px) scale(3); opacity:0; }
  }

  /* UI */
  .topbar {
    position:absolute;
    top:0; left:0; right:0;
    z-index:10;
    padding:24px 40px;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .logo { font-weight:900; letter-spacing:0.15em; font-size:14px; }
  .logo span { color:#ff1a1a; }
  .badge {
    border:1px solid rgba(255,255,255,0.2);
    padding:6px 14px;
    border-radius:100px;
    font-size:11px;
    letter-spacing:0.1em;
    background:rgba(255,255,255,0.05);
    backdrop-filter: blur(10px);
  }
  .content {
    position:absolute;
    bottom:0; left:0; right:0;
    z-index:10;
    padding:40px;
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
  }
  h1 {
    font-size: clamp(32px, 6vw, 64px);
    line-height:0.9;
    font-weight:900;
    text-transform:uppercase;
  }
  h1 i { font-style:normal; color:#ff1a1a; }
  .meta { font-size:12px; opacity:0.6; margin-top:12px; letter-spacing:0.1em; }
  .btn {
    background:#ff1a1a;
    color:#fff;
    border:none;
    padding:14px 28px;
    border-radius:6px;
    font-weight:700;
    letter-spacing:0.05em;
    cursor:pointer;
    box-shadow: 0 10px 30px rgba(255,26,26,0.4);
    transition:0.2s;
  }
  .btn:hover { transform: translateY(-2px); box-shadow:0 15px 40px rgba(255,26,26,0.6); }
</style>
</head>
<body>
  <div class="tunnel">
    <div class="car-wrap">
      <div class="car">
        <div class="headlight left"></div>
        <div class="headlight right"></div>
      </div>
    </div>
  </div>

  <div class="particles" id="particles"></div>

  <div class="topbar">
    <div class="logo"><span>NEO</span> BURST</div>
    <div class="badge">4K • 60FPS • SEAMLESS LOOP</div>
  </div>

  <div class="content">
    <div>
      <h1>BREAK<br><i>OUT</i></h1>
      <div class="meta">RAY TRACING / ANAMORPHIC 3D / LIVE WALLPAPER</div>
    </div>
    <button class="btn">DOWNLOAD WALLPAPER</button>
  </div>

<script>
  // generate flying particles
  const container = document.getElementById('particles');
  for(let i=0;i<60;i++){
    const p = document.createElement('div');
    p.className='particle';
    p.style.left = 50 + (Math.random()-0.5)*60 + '%';
    p.style.top = 50 + (Math.random()-0.5)*40 + '%';
    p.style.setProperty('--x', (Math.random()-0.5)*1000 + 'px');
    p.style.setProperty('--y', (Math.random()-0.5)*800 + 'px');
    p.style.animationDuration = (0.8 + Math.random()*1.5) + 's';
    p.style.animationDelay = Math.random()*2 + 's';
    container.appendChild(p);
  }
</script>
</body>
</html>
