<!DOCTYPE html>
<html>

<head> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0" >
    <title>Image shapes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>


    <div class="container d-flex justify-content-between m-5">
   
        <div  style="width: 100px; height: 100px;">
        <img class="w-100 h-100 rounded-0" src="./2 doggs realistic.png">
    </div>

    <div  style="width: 100px; height: 100px;">
        <img class="w-100 h-100 rounded-3" src="./2 doggs realistic.png">
    </div>


    <div style="width: 100px; height: 100px;">
    <img 
        src="./2 doggs realistic.png"
        class="w-100 h-100 rounded-circle object-fit-fill"
        alt="Dogs">
    </div>


    <div style="width: 100px; height: 100px;">
        <img class="w-100 h-100 " style="transform: rotate(45deg);" src="./2 doggs realistic.png">
    </div>
</div>
<br>

<div class="d-flex">  
    
    <div style="width: 100px; height: 100px;">
    <img 
        src="./2 doggs realistic.png"
        class="w-100 h-100 object-fit-fill" style="clip-path: polygon(50% 0%, 100% 38%, 82% 100%, 18% 100%, 0% 38%);"
        alt="Dogs">
    </div>
    
    <div style="width: 100px; height: 100px;">
    <img 
        src="./2 doggs realistic.png"
        class="w-100 h-100 object-fit-fill" style="clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);"
        alt="Dogs">
    </div>

     
</div>

</body>
    

    </html>
