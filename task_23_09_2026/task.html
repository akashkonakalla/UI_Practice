<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task on 23/09/2026</title>

    <style>
        .container {
            width: 150%;
            border: 1px solid rgb(130, 130, 247)
        }
     body div h1 {
        margin-top: 0;
        background-color: rgb(105, 105, 236);
        width: 100%;
        color: white;
     }

     img{
        height: 100px;
        width: 100px;
     }


     div ol {

        list-style-type: none;
        padding: 0px;
        display: flex;
        flex-direction: row;
        align-items: center;

     }
     
     div ol li {
        
        border: 1px solid rgb(130, 130, 247);
        padding: 10px;
        margin: 10px;
        width: 100%;
        height: 100%;
        text-align: left;
     }
     
     .button-container button {
        background-color: rgb(105, 105, 236);
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 10px;
        cursor: pointer;
     }

     .button-container , .image-container {
        display: flex;
        justify-content: center;
     }
    </style>
</head>
<body>
    <div class="container">
        <h1>Task 2 - Product Cards (Flexbox)</h1>

        <ol> 
        <li class= "1">
            <div class="image-container">
            <img src="./ASUS-ROG-Strix-G17.png" alt="Product 1">
            </div>
            <h2>Laptop</h2>
            <h3>₹50,000</h3>
            <p>Description of Product 1</p>
            <div class="button-container">
            <button>Add to Cart</button>
            </div>
        </li>

        <li class= "2">
            <div class="image-container">
            <img src="./Headphones.png" alt="Product 2">
            </div>
            <h2>Headphones</h2>
            <h3>₹2,000</h3>
            <p>Description of Product 2</p>
            <div class="button-container">
            <button>Add to Cart</button>
            </div>
        </li>

        <li class= "3">
            <div class="image-container">
            <img src="./Smartwatch.png" alt="Product 3">
            </div>
             <h2>Smart Watch</h2>
            <h3>₹5,000</h3>
            <p>Description of Product 3</p>
            <div class="button-container">
            <button>Add to Cart</button>
            </div>
        </li>

        <li class= "4">
            <div class="image-container">
            <img src="./Backpack.png" alt="Product 4">
            </div> 
            <h2>Backpack</h2>
            <h3>₹1,500</h3>
            <p>Description of Product 4</p>
            <div class="button-container">
            <button>Add to Cart</button>
            </div>
        </li>
        </ol>
        

    </div>
</body>
</html>
